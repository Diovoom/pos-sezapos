<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <title>SEZA POS</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1e40af;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #1e40af;
      }
      .logo {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      }
      .logo svg { width: 96px; height: 96px; }
      .title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .spin {
        width: 28px; height: 28px;
        border: 3px solid rgba(255,255,255,0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: r 0.9s linear infinite;
      }
      @keyframes r { to { transform: rotate(360deg); } }
    </style>
    <meta http-equiv="refresh" content="0; url=https://sezapos.com/auth?native=1" />
  </head>
  <body>
    <div class="stage">
      <div class="logo">
        <!-- SEZA mark (blue on white) -->
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#1e40af"/>
          <path d="M32 34c0-4 4-8 10-8h16c6 0 10 4 10 8s-4 8-10 8H42c-6 0-10 4-10 8s4 8 10 8h16c6 0 10 4 10 8s-4 8-10 8H42c-6 0-10-4-10-8" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="title">SEZA POS</div>
      <div class="spin" aria-hidden="true"></div>
    </div>
    <script>window.location.replace("https://sezapos.com/auth?native=1");</script>
  </body>
</html>
