name: SEZA production quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --legacy-peer-deps
      - name: Verify icon imports
        run: node scripts/verify-lucide-imports.mjs
      - name: Verify release contracts
        run: npm run verify:production
      - name: Verify security contracts
        run: npm run verify:security
      - name: Lint
        run: npm run lint
      - name: Build hosted website
        run: npm run build
      - name: Build and sync Android web assets
        run: npm run android:sync
      - name: Compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
