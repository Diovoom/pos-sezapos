name: Build SEZA POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SEZA POS
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Sync SEZA Android
        run: npm run android:sync

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK permissions
        working-directory: android
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/seza-apk-permissions.txt
          grep -Fq "android.permission.ACCESS_FINE_LOCATION" /tmp/seza-apk-permissions.txt
          grep -Fq "android.permission.BLUETOOTH_SCAN" /tmp/seza-apk-permissions.txt
          grep -Fq "android.permission.BLUETOOTH_CONNECT" /tmp/seza-apk-permissions.txt

      - name: Prepare latest APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SEZA-POS-latest.apk

      - name: Upload SEZA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEZA-POS-APK
          path: SEZA-POS-latest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest SEZA POS APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view seza-pos-latest >/dev/null 2>&1; then
            gh release upload seza-pos-latest SEZA-POS-latest.apk --clobber
          else
            gh release create seza-pos-latest SEZA-POS-latest.apk               --target "${GITHUB_SHA}"               --title "SEZA POS Latest"               --notes "Latest successful SEZA POS Android build from main."
          fi
