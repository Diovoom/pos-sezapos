# SEZA POS low-memory Android build settings.
# The user's Windows laptop has 4 GB RAM, so keep Gradle/Kotlin single-worker
# and in-process instead of allowing multiple daemons to exhaust memory.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
