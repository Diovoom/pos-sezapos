<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>SEZA POS</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #ffffff; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      .seza-preboot {
        height: 100%; display: grid; place-items: center; color: #0f172a; text-align: center;
      }
      .seza-preboot-mark {
        width: 92px; height: 92px; border-radius: 50%; background: #fff; color: #1e40af;
        display: grid; place-items: center; margin: 0 auto 18px; font-size: 42px; font-weight: 800;
        box-shadow: 0 20px 60px rgba(0,0,0,.25);
      }
      .seza-preboot-spinner {
        width: 24px; height: 24px; border: 3px solid rgba(255,255,255,.28);
        border-top-color: #fff; border-radius: 50%; margin: 18px auto 0;
        animation: seza-preboot-spin .9s linear infinite;
      }
      @keyframes seza-preboot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="seza-preboot" role="status" aria-live="polite">
        <div>
          <div class="seza-preboot-mark">S</div>
          <strong>SEZA POS</strong>
          <div class="seza-preboot-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
